name: Publish to Comfy Registry

# Adapted from ComfyUI-MAINodes' publish-node.yml. Runs only when started by hand (Actions tab > Run workflow), so
# merging a version bump does not publish by itself. The registry rejects a re-publish of an existing version, so the
# version field in pyproject.toml is still the release switch.
#
# Needs one repository secret, COMFY_REGISTRY: a Comfy Registry personal access token for the publisher named in
# pyproject.toml ([tool.comfy] PublisherId). Without it the run fails and nothing is published.
#
# To publish on every version bump, as MAINodes does, add under `on:`
#   push:
#     branches: [main]
#     paths: ["pyproject.toml"]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'matlowai/ComfyUI-Dials'
    runs-on: ubuntu-latest
    steps:
      - name: Publish custom node        # the action checks out for itself
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.COMFY_REGISTRY }}
